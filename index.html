<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b3f"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>הלו״ז שלי</title><style>
:root{--ink:#101b3f;--muted:#7d849a;--paper:#f5f6fa;--card:#fff;--purple:#7256ff;--mint:#38c99e;--shadow:0 12px 34px rgba(20,28,60,.08)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}.shell{max-width:1100px;margin:auto;padding:28px 28px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.hello small{display:block;color:var(--muted);font-weight:700;font-size:14px}.hello h1{margin:5px 0 0;font-size:28px}.date-pill{background:#eae7ff;color:var(--purple);padding:10px 15px;border-radius:16px;font-weight:800;font-size:14px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#101b3f,#253771);color:#fff;border-radius:28px;padding:26px;margin-bottom:24px;box-shadow:var(--shadow)}.hero:after{content:'✓';position:absolute;left:18px;bottom:-46px;font-size:160px;font-weight:900;color:rgba(255,255,255,.055)}.hero .kicker{color:#b9c6ed;font-weight:700;font-size:14px}.hero h2{font-size:24px;margin:7px 0 16px}.meter{height:8px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden}.meter span{display:block;height:100%;background:var(--mint);border-radius:9px}.hero-foot{display:flex;justify-content:space-between;margin-top:9px;font-size:13px;color:#d6dcf0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 3px 12px}.section-title h2{font-size:20px;margin:0}.section-title span{color:var(--muted);font-size:13px}.timeline{display:grid;gap:10px}.task{display:grid;grid-template-columns:64px 1fr 46px;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 5px 18px rgba(20,28,60,.045);border:1px solid #eef0f6;transition:.2s}.task.done{opacity:.55}.task.done .task-title{text-decoration:line-through}.time{font-size:16px;font-weight:900}.task-title{font-size:16px;font-weight:800}.tag{display:inline-block;margin-top:5px;font-size:12px;color:var(--muted)}.check{width:42px;height:42px;border:2px solid #dfe2ec;background:#fff;border-radius:14px;font-size:21px;color:#fff;cursor:pointer}.task.done .check{background:var(--mint);border-color:var(--mint)}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day{background:#fff;border:1px solid #ebedf4;border-radius:19px;padding:14px;min-height:146px}.day.today{border:2px solid var(--purple);box-shadow:0 7px 22px rgba(114,86,255,.12)}.day h3{margin:0 0 12px;font-size:14px}.day h3 small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.mini{border-right:4px solid var(--purple);padding:6px 8px;margin:7px 0;background:#f8f7ff;border-radius:7px;font-size:12px;font-weight:700}.goals{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.goal{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 20px rgba(20,28,60,.05)}.goal-top{display:flex;justify-content:space-between;align-items:center}.goal-icon{font-size:27px;background:#f4f5f9;border-radius:14px;width:48px;height:48px;display:grid;place-items:center}.goal-value{font-size:23px;font-weight:900;margin:15px 0 3px}.goal-label{color:var(--muted);font-size:13px}.goal .meter{margin-top:13px;background:#eceef4}.empty{text-align:center;background:#fff;padding:40px;border-radius:24px;color:var(--muted)}.offline{display:none;background:#fff2cc;color:#795a00;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px}.bottom{position:fixed;z-index:9;bottom:0;left:0;right:0;background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-top:1px solid #e7e9f0;padding:9px max(14px,calc((100vw - 700px)/2));padding-bottom:max(9px,env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav{border:0;background:transparent;color:#9399aa;font-weight:800;font-size:11px;padding:7px 14px;border-radius:14px;cursor:pointer;min-width:70px}.nav b{display:block;font-size:22px;margin-bottom:2px}.nav.active{color:var(--purple);background:#f0edff}.view{display:none}.view.active{display:block}.month-head{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:18px;border-radius:20px;margin-bottom:12px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cell{background:#fff;min-height:92px;padding:9px;border-radius:14px;font-weight:800}.cell.muted{opacity:.35}.dot{width:7px;height:7px;background:var(--purple);border-radius:50%;display:inline-block;margin:10px 2px 0}@media(max-width:720px){.shell{padding:20px 15px 105px}.week-grid{display:grid;grid-template-columns:1fr}.day{min-height:0}.day:not(.today){display:none}.goals{grid-template-columns:1fr}.month-grid{gap:4px}.cell{min-height:63px;padding:7px;font-size:12px}.top{margin-bottom:18px}.hello h1{font-size:24px}.date-pill{padding:9px 11px}.hero{padding:22px;border-radius:24px}.task{grid-template-columns:54px 1fr 44px;padding:13px 12px}.bottom{padding-inline:7px}.nav{min-width:62px;padding:7px 8px}}
</style></head><body><main class="shell"><div class="top"><div class="hello"><small>שלום יהודה 👋</small><h1 id="title">היום שלך</h1></div><div class="date-pill" id="dateLabel">יום ה׳, 17.9</div></div><div class="offline" id="offline">מציג גרסה שמורה. החיבור יתחדש אוטומטית.</div><section id="today" class="view active"><div class="hero"><div class="kicker">המיקוד להיום</div><h2>לעשות את הדברים החשובים, בלי עומס</h2><div class="meter"><span id="todayMeter" style="width:0%"></span></div><div class="hero-foot"><span id="doneText">0 משימות הושלמו</span><span id="leftText">יום מסודר מתחיל כאן</span></div></div><div class="section-title"><h2>המשימות שלי</h2><span id="updated"></span></div><div class="timeline" id="todayTasks"></div></section><section id="week" class="view"><div class="section-title"><h2>השבוע שלי</h2><span>18–24 בספטמבר</span></div><div class="week-grid" id="weekGrid"></div></section><section id="month" class="view"><div class="month-head"><b>ספטמבר 2026</b><span>‹ &nbsp; ›</span></div><div class="month-grid" id="monthGrid"></div></section><section id="goals" class="view"><div class="section-title"><h2>מטרות ויעדים</h2><span>התקדמות בזמן אמת</span></div><div class="goals" id="goalsGrid"></div></section></main><nav class="bottom"><button class="nav active" data-view="today"><b>☀️</b>היום</button><button class="nav" data-view="week"><b>📅</b>שבוע</button><button class="nav" data-view="month"><b>🗓️</b>חודש</button><button class="nav" data-view="goals"><b>🎯</b>יעדים</button></nav><script>
let state; const labels={focus:'מיקוד',work:'עבודה',growth:'צמיחה',admin:'ניהול',travel:'תיירות',tech:'פיתוח'};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/state');if(!r.ok)throw 0;state=await r.json();localStorage.setItem('luaz',JSON.stringify(state));document.querySelector('#offline').style.display='none'}catch(e){state=JSON.parse(localStorage.getItem('luaz')||'null');document.querySelector('#offline').style.display='block'}render()}
function render(){if(!state)return;const day=state.days[0],done=day.tasks.filter(t=>t.done).length,total=day.tasks.length,pct=total?done/total*100:0;document.querySelector('#todayMeter').style.width=pct+'%';document.querySelector('#doneText').textContent=`${done} מתוך ${total} הושלמו`;document.querySelector('#leftText').textContent=done===total?'סיימת להיום 👏':`${total-done} נשארו`;document.querySelector('#todayTasks').innerHTML=day.tasks.map(t=>`<article class="task ${t.done?'done':''}"><div class="time">${esc(t.time)}</div><div><div class="task-title">${esc(t.title)}</div><span class="tag">${labels[t.kind]||''}</span></div><button class="check" aria-label="סימון משימה" onclick="toggle('${esc(t.id)}',${!t.done})">${t.done?'✓':''}</button></article>`).join('')||'<div class="empty">אין משימות להיום 🎉</div>';document.querySelector('#weekGrid').innerHTML=state.days.map((d,i)=>`<article class="day ${i===0?'today':''}"><h3>${esc(d.label)}<small>${Number(d.date.slice(-2))}.9</small></h3>${d.tasks.map(t=>`<div class="mini" style="border-color:${t.done?'#38c99e':'#7256ff'}">${esc(t.time)} · ${esc(t.title)}</div>`).join('')}</article>`).join('');document.querySelector('#goalsGrid').innerHTML=state.goals.map(g=>{const p=Math.min(100,Math.round(g.current/g.target*100));return `<article class="goal"><div class="goal-top"><div><b>${esc(g.title)}</b><div class="goal-value">${g.current.toLocaleString('he-IL')} <small>/ ${g.target.toLocaleString('he-IL')}</small></div><div class="goal-label">${esc(g.unit)} · ${p}%</div></div><div class="goal-icon">${g.icon}</div></div><div class="meter"><span style="width:${p}%;background:${g.color}"></span></div></article>`}).join('');renderMonth();document.querySelector('#updated').textContent='מעודכן עכשיו'}
function renderMonth(){const first=2,days=30;let a=['א','ב','ג','ד','ה','ו','ש'].map(x=>`<div style="text-align:center;color:#7d849a;font-size:12px">${x}</div>`);for(let i=0;i<first;i++)a.push('<div class="cell muted"></div>');for(let d=1;d<=days;d++){const has=state.days.some(x=>Number(x.date.slice(-2))===d);a.push(`<div class="cell ${d===18?'today':''}">${d}${has?'<div><i class="dot"></i></div>':''}</div>`)}document.querySelector('#monthGrid').innerHTML=a.join('')}
async function toggle(id,done){for(const d of state.days)for(const t of d.tasks)if(t.id===id)t.done=done;render();localStorage.setItem('luaz',JSON.stringify(state));try{const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'toggle_task',taskId:id,done})});if(!r.ok)throw 0}catch(e){document.querySelector('#offline').style.display='block'}}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.view).classList.add('active');document.querySelector('#title').textContent={today:'היום שלך',week:'השבוע שלך',month:'החודש שלך',goals:'המטרות שלך'}[b.dataset.view]});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');load();
</script></body></html>
